services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qalab
      POSTGRES_PASSWORD: qalab
      POSTGRES_DB: qa_product_lab
    ports:
      - "5432:5432"
    volumes:
      - qa_product_lab_pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d

volumes:
  qa_product_lab_pgdata:
